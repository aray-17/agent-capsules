[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-capsules"
version = "0.1.0"
description = "Quality-gated granularity control for multi-agent LLM pipelines"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aninda Ray", email = "research@anindaray.com" },
]
keywords = [
    "llm", "multi-agent", "agent-framework", "agentic", "orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jinja2",
    "numpy",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/aray-17/agent-capsules"
Source = "https://github.com/aray-17/agent-capsules"
Issues = "https://github.com/aray-17/agent-capsules/issues"

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
gemini = ["google-genai"]
redis = ["redis"]
demo = ["streamlit", "plotly"]
docs = ["sphinx", "sphinx-rtd-theme"]
evals = ["dspy"]
dev = [
    "pytest",
    "fakeredis",
    "redis",
    "sphinx",
    "sphinx-rtd-theme",
    "anthropic",
    "openai",
    "google-genai",
    "streamlit",
    "plotly",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_capsules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require real API keys (skip with -m 'not integration')",
]
